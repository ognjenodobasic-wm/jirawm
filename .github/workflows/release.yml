name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Version guard
        run: |
          MANIFEST_VERSION=$(node -p "require('./dist/manifest.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Manifest version: $MANIFEST_VERSION"
          echo "Tag version:      $TAG_VERSION"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: manifest version ($MANIFEST_VERSION) does not match tag version ($GITHUB_REF_NAME)."
            exit 1
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          body: |
            **Testeri:** preuzmite `jirawm-${{ github.ref_name }}.zip` ispod (Assets). `Source code` arhive su za razvoj, ne za instalaciju. Uputstvo: `INSTALL.md` unutar ZIP-a.
